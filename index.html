<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luna Premium — Luna Founder</title>
  <meta name="description" content="Download the newest Luna desktop assistant from Luna Founder.">
  <style>
    :root{color-scheme:dark;--bg:#050c10;--panel:rgba(9,27,34,.92);--line:#25d8b3;--text:#efffff;--muted:#a8c4cb;--accent:#55e8c3}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#123e4b 0,#08171d 42%,var(--bg) 78%);color:var(--text);font-family:Segoe UI,Arial,sans-serif}
    .card{width:min(760px,100%);padding:42px 34px 34px;text-align:center;border:1px solid rgba(37,216,179,.45);border-radius:26px;background:var(--panel);box-shadow:0 24px 90px rgba(23,255,205,.12)}
    .badge{display:inline-block;padding:7px 13px;border:1px solid rgba(37,216,179,.55);border-radius:999px;color:#91ffe8;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    h1{margin:18px 0 8px;font-size:clamp(38px,7vw,58px);line-height:1}
    .sub{max-width:620px;margin:0 auto;color:var(--muted);font-size:18px;line-height:1.55}
    .details{margin:26px auto 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:560px}
    .item{padding:14px;border-radius:15px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08)}
    .label{display:block;font-size:11px;color:#7f9ca4;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.value{font-weight:700}
    .btn{display:inline-block;margin-top:30px;padding:16px 26px;border-radius:14px;background:var(--accent);color:#051218;text-decoration:none;font-weight:900;box-shadow:0 10px 30px rgba(61,233,190,.2)}
    .btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
    .status{margin:16px auto 0;min-height:20px;color:#a9c9d0;font-size:14px}
    .note{margin:14px auto 0;max-width:620px;color:#7e969e;font-size:13px;line-height:1.5}
    footer{margin-top:26px;color:#5f777e;font-size:12px}
    @media (max-width:560px){.details{grid-template-columns:1fr}.card{padding:32px 20px 26px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Luna Founder</div>
    <h1>Luna Premium</h1>
    <p class="sub">Download the newest Luna desktop assistant. This GitHub Pages version needs no server or payment setup.</p>

    <section class="details" aria-label="Luna details">
      <div class="item"><span class="label">Publisher</span><span class="value">Luna Founder</span></div>
      <div class="item"><span class="label">Wake phrase</span><span class="value">Hey Luna AI</span></div>
    </section>

    <a id="downloadBtn" class="btn" href="./Luna.zip" download="Luna.zip">Download newest Luna</a>
    <div id="status" class="status" aria-live="polite"></div>
    <p class="note">The download is the <strong>Luna.zip</strong> file in this same GitHub Pages repository.</p>
    <footer>Hosted with GitHub Pages</footer>
  </main>

  <script>
    const btn = document.getElementById('downloadBtn');
    const status = document.getElementById('status');
    btn.addEventListener('click', () => {
      status.textContent = 'Starting Luna download…';
      setTimeout(async () => {
        try {
          const r = await fetch('./Luna.zip', { method: 'HEAD', cache: 'no-store' });
          if (!r.ok) status.textContent = 'Download file not found. Make sure Luna.zip is uploaded beside index.html.';
        } catch (_) {
          // The download itself may still succeed even when HEAD is restricted.
        }
      }, 700);
    });
  </script>
</body>
</html>
